# scoop-boot profiles (delivered by scoop-boot.ps1 --update; do not edit).
#
# A profile is a directory under etc\profiles with up to four files, each
# optional: packages.txt (Scoop manifests in install order, format of
# default.txt), system.env (Machine-scope environment lines, format of the
# system.* files), user.env (User-scope lines) and debian.txt (apt packages for
# --wsl-setup). scoop-boot.ps1 --profile=NAME,NAME,... composes the selected
# profiles into this machine's files: etc\packages\<host>.txt,
# etc\packages\<host>.debian.txt, etc\environments\system.<host>.<user>.env and
# user.<host>.<user>.env. --admin-init --profile=... does the same during the setup.
#
# "profile NAME description": a single profile. The order of these lines is the
# order in which the files are composed, whatever order the names are given in:
# packages install in this order, and environment lines of a later profile come
# after those of an earlier one (a later PATH+= wins). base is always included
# and always first; c++ must stay behind perl: its UCRT64 PATH line has to beat
# the DLLs that Git and Perl ship (see c++\system.env).
#
# "NAME=a,b,c": a virtual profile, the union of the named profiles (single or
# virtual). devel is the developer workplace scoop-boot was written for and the
# content of default.txt; devops is the infrastructure workplace.

profile base         Conventions (USR, DATA, DEVL_ROOT, TMP), Git, OpenSSH, gh, VC++ runtime, locale
profile desktop      Browsers, editors (VS Code, Neovim, Notepad++, HxD), Windows Terminal, file and screenshot tools, KeePass, Postman
profile ide          JetBrains Toolbox
profile cli          jq, yq, curl, ripgrep, fd, bat, fzf, less, btop, jid
profile svn          TortoiseSVN with svn.exe
profile java         Temurin JDK 25, Maven, Gradle, Ant, Kotlin
profile node         Node.js
profile perl         Strawberry Perl
profile python       Python 3.14
profile c++          MSYS2 with GCC (UCRT64), make, cmake, ninja, vcpkg
profile docs         Graphviz, Doxygen, Pandoc, Ghostscript
profile network      nmap, Wireshark, PuTTY, WinSCP, FileZilla, OpenSSL, GnuPG
profile netdiag      tcping, trippy, doggo, dig (bind), sslscan, iperf3, mRemoteNG; tcpdump, mtr and friends in Debian
profile db           SQLite, DBeaver
profile dbclients    sqlcmd, PostgreSQL (psql); postgresql-client and ldap-utils in Debian
profile server       MariaDB, Tomcat
profile azure        Azure CLI
profile azure-tools  AzCopy, Service Bus Explorer, Storage Explorer
profile iac          Terraform, tflint, terraform-docs, trivy
profile pwsh         PowerShell 7
profile automation   Ansible and rsync in Debian (no Windows packages)
profile media        ffmpeg, IrfanView, Krita

devel=desktop,ide,cli,svn,java,node,perl,python,c++,docs,network,db,server,azure,media
devops=desktop,cli,python,pwsh,network,netdiag,azure,azure-tools,iac,dbclients,automation
