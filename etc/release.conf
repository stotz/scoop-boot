# bin/release.sh configuration for scoop-boot (bash, NAME=VALUE; see the header of
# bin/release.sh for the defaults). Tags are vNNNN, the version is read from the
# script header, the README must name the signing key's fingerprint.
NAMESPACE=scoop-boot
TAG_PATTERN='^v[0-9]{4}$'
VERSION_FILE=bin/scoop-boot.ps1
VERSION_REGEX='^ *Version: *\([0-9.]*\)'
FINGERPRINT_FILE=README.md
